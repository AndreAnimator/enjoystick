services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: enjoystick
      MYSQL_USER: enjoystick
      MYSQL_PASSWORD: enjoystick
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Têm prioridade sobre o .env (o .env.example vem com DB_CONNECTION=sqlite).
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: enjoystick
      DB_USERNAME: enjoystick
      DB_PASSWORD: enjoystick
    volumes:
      - .:/app
      # vendor/ em volume próprio: o bind mount acima esconderia o vendor/ da imagem.
      - php_vendor:/app/vendor
    command:
      - sh
      - -c
      - |
        set -e
        [ -f .env ] || cp .env.example .env
        grep -q '^APP_KEY=.\+' .env || php artisan key:generate --force
        composer install --no-interaction --prefer-dist
        php artisan migrate --force
        php artisan db:seed --force
        # --no-reload: sem isso o artisan serve descarta as variáveis de ambiente acima
        # (menos as da lista interna dele) e o app voltaria a ler o DB do .env.
        exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      # a primeira inicialização roda composer install, migrate e seed antes de responder
      start_period: 300s

volumes:
  mysql_data:
  php_vendor: